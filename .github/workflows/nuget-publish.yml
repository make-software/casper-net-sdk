name: Publish to nuget.org

on:
  workflow_dispatch:

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to push version tags.
      id-token: write # Required by NuGet/login to request an OIDC token.

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Include existing version tags so reruns can skip them.

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Pack SDK
        run: dotnet pack Casper.Network.SDK/Casper.Network.SDK.csproj --configuration Release --output artifacts

      - name: Pack CES
        run: dotnet pack Casper.Network.SDK.CES/Casper.Network.SDK.CES.csproj --configuration Release --output artifacts

      # Configure a nuget.org Trusted Publishing policy for make-software/casper-net-sdk,
      # workflow nuget-publish.yml, with no environment and access to both packages.
      - name: Log in to NuGet with Trusted Publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          # NuGet profile username (not email) associated with the publishing policy.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
          --no-symbols

      - name: Tag published versions
        run: |
          for project in Casper.Network.SDK/Casper.Network.SDK.csproj Casper.Network.SDK.CES/Casper.Network.SDK.CES.csproj; do
            version=$(dotnet msbuild "$project" -getProperty:PackageVersion -nologo)
            tag="v$version"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Tag $tag already exists; skipping."
              continue
            fi
            git tag "$tag"
            git push origin "refs/tags/$tag"
          done
